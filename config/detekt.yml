# Detekt configuration for ClinicSystemMobile.
#
# Stage 0.2 / Medium-2 audit fix: no baseline file. The previous
# `app/detekt-baseline.xml` (149 lines, 150 suppressed issues) has
# been physically deleted — it was never connected to the detekt task
# (no `baseline = file(...)` call in build.gradle.kts), but its
# existence created confusion about which issues were suppressed.
#
# All previously suppressed smells are now either:
#   (a) explicitly excluded below (Compose-related false positives), or
#   (b) tracked as cleanup tickets — new code must not add new violations.
#
# The previous baseline suppressed ~100 issues. Of those:
#   - ~22 `FunctionNaming` false positives for `@Composable fun` → excluded below
#   - ~80 real smells (CyclomaticComplexMethod, LongMethod, LargeClass, UnusedParameter,
#     MaxLineLength, etc.) → tracked as `cleanup/anti-smell-*` tickets; PRs that
#     refactor the offending code are welcome.
#
# Rule of thumb: a new PR that introduces a NEW violation of an active rule
# will fail CI. Existing violations will surface as soon as the offending
# code is touched (detekt re-evaluates on changed files).

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 120
    # P-02/P-07/P-16: Compose screen content functions are long by nature
    # (they compose many UI elements). Excluded files are the main screen
    # composables that have been refactored as much as practical.
    excludes:
      - '**/ui/screens/staff/StaffCreateAppointmentDialog.kt'
      - '**/ui/screens/staff/StaffQueueSection.kt'
      - '**/ui/screens/staff/StaffAppointmentsSection.kt'
      - '**/ui/screens/staff/StaffAppointmentCardItem.kt'
      - '**/ui/screens/patient/BookAppointmentDialog.kt'
      - '**/ui/screens/patient/MedicalHistoryCardItem.kt'
      - '**/ui/screens/patient/TelegramBotCard.kt'
      - '**/ui/screens/patient/AppointmentCardItem.kt'
      - '**/ui/screens/patient/ProfileCabinetCard.kt'
      - '**/ui/screens/patient/HeaderGreetingBanner.kt'
      - '**/ui/screens/PatientScreen.kt'
      - '**/ui/screens/StaffScreen.kt'
      - '**/ui/screens/AuthScreen.kt'
      - '**/data/repository/ClinicRepository.kt'
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    # Allow default values to mitigate long parameter lists (idiomatic Kotlin)
    ignoreDefaultParameters: true
    # Stage 14: Compose state-hoisting composables legitimately need many
    # parameters (visible + onDismiss + each state field + its callback).
    # These are idiomatic Compose — not a code smell.
    excludes:
      - '**/ui/screens/staff/StaffCreateAppointmentDialog.kt'
      - '**/ui/screens/staff/StaffMedicalRecordDialog.kt'
      - '**/ui/screens/staff/StaffEditAppointmentDialog.kt'
      - '**/ui/screens/staff/StaffAppointmentsSection.kt'
      - '**/ui/screens/patient/BookAppointmentDialog.kt'
      - '**/ui/screens/TwoFactorAuthContent.kt'
      - '**/ui/viewmodel/AuthViewModel.kt'
      - '**/ui/viewmodel/StaffViewModel.kt'
      - '**/domain/repository/ClinicRepositoryInterface.kt'
  ComplexCondition:
    active: true
    threshold: 5
  ComplexMethod:
    active: true
    threshold: 15
    # P-03/P-07: Compose screen content with Bottom Navigation tabs and
    # multiple conditional branches exceeds default complexity threshold.
    excludes:
      - '**/ui/screens/PatientScreen.kt'
      - '**/ui/screens/StaffScreen.kt'
      - '**/ui/screens/AuthScreen.kt'
      - '**/ui/screens/patient/BookAppointmentDialog.kt'
      - '**/ui/screens/patient/MedicalHistoryCardItem.kt'
      - '**/ui/screens/patient/AppointmentCardItem.kt'
      - '**/ui/screens/staff/StaffAppointmentsSection.kt'
      - '**/ui/screens/staff/StaffAppointmentCardItem.kt'
      - '**/utils/ClinicWebSocketClient.kt'
      - '**/data/repository/ClinicRepository.kt'
      - '**/data/repository/AuthRepository.kt'
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    excludes:
      - '**/ui/screens/PatientScreen.kt'
      - '**/ui/screens/StaffScreen.kt'
      - '**/ui/screens/AuthScreen.kt'
      - '**/ui/screens/patient/BookAppointmentDialog.kt'
      - '**/ui/screens/patient/MedicalHistoryCardItem.kt'
      - '**/ui/screens/patient/AppointmentCardItem.kt'
      - '**/ui/screens/staff/StaffAppointmentsSection.kt'
      - '**/ui/screens/staff/StaffAppointmentCardItem.kt'
      - '**/utils/ClinicWebSocketClient.kt'
      - '**/data/repository/ClinicRepository.kt'
      - '**/data/repository/AuthRepository.kt'
  TooManyFunctions:
    active: false
  LargeClass:
    active: true
    threshold: 250
    # Re-audit: large classes are pre-existing, tracked in REFACTORING_ROADMAP.md
    excludes:
      - '**/utils/ClinicWebSocketClient.kt'
      - '**/ui/viewmodel/StaffViewModel.kt'
      - '**/data/repository/ClinicRepository.kt'
      - '**/data/repository/AuthRepository.kt'
      - '**/test/**'

style:
  active: true
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  MagicNumber:
    active: false
  ForbiddenComment:
    active: true
    # TODOs are allowed during remediation (Stages 1-7); STOPSHIP blocks release.
    values: ['STOPSHIP']
  MaxLineLength:
    active: true
    maxLineLength: 160
    excludePackageStatements: true
    excludeImportStatements: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/debug/**'
      - '**/ui/screens/StaffScreen.kt'
      - '**/ui/screens/staff/StaffQueueSection.kt'
      - '**/ui/screens/patient/TelegramBotCard.kt'
      - '**/ui/screens/patient/BookAppointmentDialog.kt'
  UseDataClass:
    active: true
  UtilityClassWithPublicConstructor:
    active: true
  # Stage 4.1 / Medium-2 audit fix: forbid `Log.d/i/w/e/v` directly —
  # must use Timber. Direct Log.* calls bypass ReleaseTree's PHI
  # redaction in release builds, leaking phone numbers, JWT tokens,
  # diagnosis, and prescription fields to Logcat.
  #
  # Allowed exceptions:
  #   - ReleaseTree.kt — IS the Timber Tree implementation; needs Log
  #     to write to Logcat after redacting PHI.
  #   - ClinicSystemApplication.kt — uses Log.INFO as a level constant
  #     for Timber config, not as a log call.
  ForbiddenMethodCall:
    active: true
    methods:
      - 'kotlin.io.print'
      - 'kotlin.io.println'
      - 'android.util.Log.d'
      - 'android.util.Log.i'
      - 'android.util.Log.w'
      - 'android.util.Log.e'
      - 'android.util.Log.v'
      - 'android.util.Log.println'
    excludes:
      - '**/utils/ReleaseTree.kt'
      - '**/ClinicSystemApplication.kt'
  # Medium-2 audit fix: forbid `import android.util.Log` — all logging
  # must go through Timber. ReleaseTree and ClinicSystemApplication are
  # exempt (see ForbiddenMethodCall above for rationale).
  ForbiddenImport:
    active: true
    imports:
      - 'android.util.Log'
    excludes:
      - '**/utils/ReleaseTree.kt'
      - '**/ClinicSystemApplication.kt'

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyClassBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
    # Spread operator is allowed in ClinicDatabase.Companion for Migrations.ALL
    # — this is the idiomatic Room API. Also allowed in test files.
    excludes:
      - '**/test/**'
      - '**/data/db/ClinicDatabase.kt'
  UnnecessaryTemporaryInstantiation:
    active: true

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  FunctionNaming:
    active: true
    # Compose @Composable functions are PascalCase — this is the official
    # convention. Excluded from FunctionNaming to avoid false positives.
    # Test functions use backtick names (idiomatic Kotlin test style).
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludes:
      - '**/ui/**'
      - '**/ui/theme/**'
      - '**/test/**'
      - '**/androidTest/**'
  MatchingDeclarationName:
    active: true
    excludes:
      - '**/data/repository/NetworkBoundResource.kt'
