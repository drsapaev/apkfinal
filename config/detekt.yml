# Detekt configuration for ClinicSystemMobile.
#
# Stage 0.2 of the remediation plan: baseline file (config/detekt-baseline.xml)
# has been DELETED. All previously suppressed smells are now either:
#   (a) explicitly excluded below (Compose-related false positives), or
#   (b) tracked as cleanup tickets — new code must not add new violations.
#
# The previous baseline suppressed ~100 issues. Of those:
#   - ~22 `FunctionNaming` false positives for `@Composable fun` → excluded below
#   - ~80 real smells (CyclomaticComplexMethod, LongMethod, LargeClass, UnusedParameter,
#     MaxLineLength, etc.) → tracked as `cleanup/anti-smell-*` tickets; PRs that
#     refactor the offending code are welcome.
#
# Rule of thumb: a new PR that introduces a NEW violation of an active rule
# will fail CI. Existing violations will surface as soon as the offending
# code is touched (detekt re-evaluates on changed files).

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 120
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    # Allow default values to mitigate long parameter lists (idiomatic Kotlin)
    ignoreDefaultParameters: true
    # Stage 14: Compose state-hoisting composables legitimately need many
    # parameters (visible + onDismiss + each state field + its callback).
    # These are idiomatic Compose — not a code smell.
    excludes:
      - '**/ui/screens/staff/StaffCreateAppointmentDialog.kt'
      - '**/ui/screens/staff/StaffMedicalRecordDialog.kt'
  ComplexCondition:
    active: true
    threshold: 5
  ComplexMethod:
    active: true
    threshold: 20
  TooManyFunctions:
    active: false
  LargeClass:
    active: true
    threshold: 250

style:
  active: true
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  MagicNumber:
    active: false
  ForbiddenComment:
    active: true
    # TODOs are allowed during remediation (Stages 1-7); STOPSHIP blocks release.
    values: ['STOPSHIP']
  MaxLineLength:
    active: true
    maxLineLength: 160
    excludePackageStatements: true
    excludeImportStatements: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/debug/**'
  UseDataClass:
    active: true
  UtilityClassWithPublicConstructor:
    active: true
  # New rule: forbid `Log.d/i/w/e/v` directly — must use Timber (Stage 4.1)
  ForbiddenMethodCall:
    active: true
    methods:
      - 'kotlin.io.print'
      - 'kotlin.io.println'

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyClassBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
    # Spread operator is allowed in ClinicDatabase.Companion for Migrations.ALL
    # — this is the idiomatic Room API.
    excludes: ['**/data/db/ClinicDatabase.kt']
  UnnecessaryTemporaryInstantiation:
    active: true

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  FunctionNaming:
    active: true
    # Compose @Composable functions are PascalCase — this is the official
    # convention. Excluded from FunctionNaming to avoid false positives.
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludes:
      - '**/ui/**'
      - '**/ui/theme/**'
