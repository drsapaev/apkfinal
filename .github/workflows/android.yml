name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Robolectric temp directories
        run: mkdir -p /tmp/robolectric-tmp

      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/robolectric
            ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-sdk-33-${{ runner.os }}-v3

      - name: Run ktlint
        run: ./gradlew ktlintCheck --max-workers=2

      - name: Run detekt
        run: ./gradlew detekt --max-workers=2

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --max-workers=2
        env:
          JAVA_TOOL_OPTIONS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
          ROBOLECTRIC_SDK_DOWNLOAD_TIMEOUT: "600"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --max-workers=2

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/detekt/
            app/build/test-results/
